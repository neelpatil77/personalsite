baseURL = 'https://www.neelpatil.com'
languageCode = 'en-us'
title = 'Neel Patil'
theme = 'hugo-theme-gallery'
enableRobotsTXT = true
timeout = "120s"

[params]
  defaultTheme = "dark"
  description = "Film photography and occasional writing by Neel Patil."
  title = "Neel Patil"
  [params.author]
    name = "Neel Patil"
    email = "neelpatil77@gmail.com"
  [params.socialIcons]
    email = "mailto:neelpatil77@gmail.com"

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML"]

[imaging]
  quality = 80
  resampleFilter = "CatmullRom"
  [imaging.exif]
    disableDate = false
    disableLatLong = true
    includeFields = "ImageDescription|Orientation"

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 20
